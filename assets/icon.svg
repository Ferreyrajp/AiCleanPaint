<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" xmlns:c2pa="http://c2pa.org/manifest">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6D28D9"/>
      <stop offset="1" stop-color="#EC4899"/>
    </linearGradient>
    <linearGradient id="bristle" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#FBCFE8"/>
    </linearGradient>
    <linearGradient id="handle" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#FDE68A"/>
      <stop offset="1" stop-color="#F59E0B"/>
    </linearGradient>
    <linearGradient id="ferrule" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#F3F4F6"/>
      <stop offset="0.5" stop-color="#D1D5DB"/>
      <stop offset="1" stop-color="#9CA3AF"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#2E1065" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- fondo -->
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>

  <!-- estela de borrado -->
  <path d="M84 398 C150 440 240 436 318 372" fill="none" stroke="#FFFFFF" stroke-opacity="0.28"
        stroke-width="34" stroke-linecap="round"/>
  <path d="M110 412 C170 438 236 432 292 388" fill="none" stroke="#FFFFFF" stroke-opacity="0.45"
        stroke-width="14" stroke-linecap="round"/>

  <!-- pincel -->
  <g transform="rotate(45 256 236)" filter="url(#shadow)">
    <rect x="234" y="60" width="44" height="190" rx="22" fill="url(#handle)"/>
    <rect x="228" y="238" width="56" height="54" rx="9" fill="url(#ferrule)"/>
    <rect x="228" y="252" width="56" height="5" fill="#6B7280" fill-opacity="0.35"/>
    <rect x="228" y="270" width="56" height="5" fill="#6B7280" fill-opacity="0.35"/>
    <path d="M228 292 H284 C284 342 272 382 256 414 C240 382 228 342 228 292 Z" fill="url(#bristle)"/>
    <path d="M256 330 C262 360 260 384 256 404" fill="none" stroke="#F9A8D4" stroke-width="4" stroke-linecap="round" stroke-opacity="0.7"/>
  </g>

  <!-- destellos (IA) -->
  <g fill="#FFFFFF">
    <path d="M414 70 Q414 104 448 104 Q414 104 414 138 Q414 104 380 104 Q414 104 414 70 Z"/>
    <path d="M122 150 Q122 170 142 170 Q122 170 122 190 Q122 170 102 170 Q122 170 122 150 Z" fill-opacity="0.9"/>
    <path d="M410 300 Q410 316 426 316 Q410 316 410 332 Q410 316 394 316 Q410 316 410 300 Z" fill-opacity="0.8"/>
  </g>
